[pytest]
# Pytest configuration for CarMax Data Classification Platform

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Coverage settings
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch

# Markers for test categorization
markers =
    unit: Unit tests (isolated component tests)
    integration: Integration tests (API endpoint tests)
    slow: Tests that take longer to execute
    databricks: Tests requiring Databricks connection

# Coverage exclusions
[coverage:run]
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

precision = 2
