# CarMax Data Classification Platform - DABs Configuration

bundle:
  name: carmax-classification

variables:
  warehouse_id:
    description: "SQL Warehouse ID for queries (set via env var WAREHOUSE_ID)"

  model_endpoint:
    description: "Foundation Model API endpoint"
    default: "databricks-claude-3-7-sonnet"

  catalog:
    description: "Target catalog for deployment"
    default: "main"

  environment:
    description: "Deployment environment (dev/prod)"
    default: "dev"

include:
  - resources/*.yml

targets:
  # Development environment
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      profile: e2-demo-field-eng

    variables:
      catalog: "main"
      environment: "dev"

  # Production environment
  prod:
    mode: production
    workspace:
      host: ${workspace.host}

    variables:
      catalog: "carmax"
      environment: "prod"
