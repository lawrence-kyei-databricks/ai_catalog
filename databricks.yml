# CarMax Data Classification Platform - DABs Configuration
#
# ============================================================
# MULTI-ORGANIZATION DEPLOYMENT NOTES:
# ============================================================
# When deploying for a different organization, update:
# 1. 'bundle.name' below (e.g., "acme-classification")
# 2. 'catalog' variable defaults if using different catalog
# 3. 'targets.prod.variables.catalog' for production deployment
# 4. 'targets.dev.workspace' and 'targets.prod.workspace' hosts
#
# This file supports variable substitution using ${var.variable_name}
# syntax, making it more flexible than app.yaml for dynamic values.
# ============================================================

bundle:
  name: carmax-classification  # Update this for your organization

variables:
  warehouse_id:
    description: "SQL Warehouse ID for queries (set via env var WAREHOUSE_ID)"

  model_endpoint:
    description: "Foundation Model API endpoint"
    default: "databricks-claude-3-7-sonnet"

  catalog:
    description: "Target catalog for deployment"
    default: "main"

  environment:
    description: "Deployment environment (dev/prod)"
    default: "dev"

include:
  - resources/*.yml

targets:
  # Development environment
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com  # Update with your workspace URL
      profile: e2-demo-field-eng  # Update with your workspace profile

    variables:
      catalog: "main"  # Update if using a different catalog
      environment: "dev"

  # Production environment
  prod:
    mode: production
    workspace:
      host: ${workspace.host}  # Set via environment variable or CLI flag

    variables:
      catalog: "carmax"  # Update with your production catalog name
      environment: "prod"
