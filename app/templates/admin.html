<!DOCTYPE html>
<html>
<head>
    <title>CarMax Classification - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }
        .header p {
            color: #64748b;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin: 10px 0;
        }
        .status-initialized {
            background: #dcfce7;
            color: #15803d;
        }
        .status-not-initialized {
            background: #fef3c7;
            color: #92400e;
        }
        .upload-section {
            margin: 20px 0;
        }
        .upload-section label {
            display: block;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .file-input {
            display: block;
            width: 100%;
            padding: 12px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .file-input:hover {
            border-color: #3b82f6;
            background: #f8fafc;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .message {
            padding: 14px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        .message.success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .message.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #1e3a8a;
        }
        .stat-label {
            font-size: 14px;
            color: #64748b;
            margin-top: 5px;
        }
        .spinner {
            display: none;
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading .spinner {
            display: block;
        }
        .home-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
        }
        .home-link:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="home-link">← Back to Home</a>

        <div class="card">
            <div class="header">
                <h1>CarMax Classification Admin</h1>
                <p>Initialize taxonomy from Excel files</p>
                <div id="status-badge"></div>
            </div>

            <div id="stats-section" class="stats" style="display: none;"></div>

            <div id="message" class="message"></div>

            <div id="upload-form">
                <div class="upload-section">
                    <label for="elements-file">Data Elements File (Data_Element_Descriptions.xlsx)</label>
                    <input type="file" id="elements-file" class="file-input" accept=".xlsx,.xls" />
                </div>

                <div class="upload-section">
                    <label for="subjects-file">Personal Data File (Personal Data_*.xlsx)</label>
                    <input type="file" id="subjects-file" class="file-input" accept=".xlsx,.xls" />
                </div>

                <button id="import-btn" class="btn btn-primary" onclick="importTaxonomy()">
                    Import Taxonomy
                </button>

                <button class="btn btn-secondary" onclick="checkStatus()">
                    Refresh Status
                </button>

                <div class="spinner" id="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        // Check status on page load
        checkStatus();

        async function checkStatus() {
            try {
                const response = await fetch('/api/admin/taxonomy-status');
                const data = await response.json();

                const badge = document.getElementById('status-badge');
                const statsSection = document.getElementById('stats-section');

                if (data.initialized) {
                    badge.className = 'status-badge status-initialized';
                    badge.textContent = '✓ Taxonomy Initialized';

                    // Show stats
                    if (data.stats) {
                        statsSection.style.display = 'grid';
                        statsSection.innerHTML = `
                            <div class="stat-box">
                                <div class="stat-value">${data.stats.elements || 0}</div>
                                <div class="stat-label">Data Elements</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value">${data.stats.tags || 0}</div>
                                <div class="stat-label">UC Tags</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value">${data.stats.subjects || 0}</div>
                                <div class="stat-label">Subject Types</div>
                            </div>
                        `;
                    }
                } else {
                    badge.className = 'status-badge status-not-initialized';
                    badge.textContent = '⚠ Not Initialized';
                    statsSection.style.display = 'none';
                }
            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        async function importTaxonomy() {
            const elementsFile = document.getElementById('elements-file').files[0];
            const subjectsFile = document.getElementById('subjects-file').files[0];
            const messageDiv = document.getElementById('message');
            const importBtn = document.getElementById('import-btn');
            const uploadForm = document.getElementById('upload-form');

            // Validate files
            if (!elementsFile || !subjectsFile) {
                showMessage('error', 'Please select both Excel files');
                return;
            }

            // Show loading
            uploadForm.classList.add('loading');
            importBtn.disabled = true;
            importBtn.textContent = 'Importing...';

            try {
                const formData = new FormData();
                formData.append('elements_file', elementsFile);
                formData.append('subjects_file', subjectsFile);
                formData.append('version', '1.0');

                const response = await fetch('/api/admin/import-taxonomy', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('success', `✓ Taxonomy imported successfully! ${data.elements_imported} elements, ${data.tags_created} tags created.`);
                    setTimeout(checkStatus, 1000);
                } else {
                    showMessage('error', `Import failed: ${data.error}`);
                }
            } catch (error) {
                showMessage('error', `Error: ${error.message}`);
            } finally {
                uploadForm.classList.remove('loading');
                importBtn.disabled = false;
                importBtn.textContent = 'Import Taxonomy';
            }
        }

        function showMessage(type, text) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 10000);
        }
    </script>
</body>
</html>
