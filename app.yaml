# Databricks App Configuration
# Defines entry point for CarMax Data Classification Platform

command:
  - "sh"
  - "-c"
  - "gunicorn --bind 0.0.0.0:${DATABRICKS_APP_PORT:-8000} --workers 1 --timeout 120 app.main:app"

name: carmax-classification

resources:
  - name: warehouse
    description: SQL warehouse for UC operations and classification
    warehouse:
      id: "8baced1ff014912d"

env:
  - name: WAREHOUSE_ID
    value: "8baced1ff014912d"

  - name: TARGET_CATALOG
    value: "main"

  - name: MODEL_ENDPOINT
    value: "databricks-claude-3-7-sonnet"

  - name: FLASK_ENV
    value: "development"
