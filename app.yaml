# Databricks App Configuration
# Defines entry point for CarMax Data Classification Platform

command: ["python", "-m", "flask", "run", "--host=0.0.0.0", "--port=8000"]

env:
  - name: FLASK_APP
    value: app/main.py
  - name: PYTHONPATH
    value: app

# App will receive WAREHOUSE_ID, TARGET_CATALOG, etc. from resources/apps.yml
